name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Actions are pinned to commit SHAs (supply chain); the comment names the tag and the commit
# date. Only adopt new SHAs once they are at least 14 days old. No job keeps git credentials.
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, 2026-08-06
      # CMake (for libopus) is preinstalled on the Windows runners.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Parse install.ps1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $bytes = [IO.File]::ReadAllBytes("$PWD\install.ps1")
          if ($bytes | Where-Object { $_ -gt 127 }) { Write-Error 'install.ps1 must be ASCII (Windows PowerShell 5.1 reads it as ANSI)'; exit 1 }

  # On Linux only a stub binary is built; the platform independent modules are tested here.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, 2026-08-06
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked

  # cargo-deny from crates.io with --locked (checksums verified by cargo), instead of an action
  # that downloads an unverified binary.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: 1.95.0
      # cargo-deny 0.20.2, 2026-07-09
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --all-features check

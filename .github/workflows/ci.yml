name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Actions are pinned to commit SHAs (supply chain); the comment names the tag and the commit
# date. Only adopt new SHAs once they are at least 14 days old.
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, 2026-07-16
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, 2026-08-06
      # CMake (for libopus) is preinstalled on the Windows runners.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Parse install.ps1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $bytes = [IO.File]::ReadAllBytes("$PWD\install.ps1")
          if ($bytes | Where-Object { $_ -gt 127 }) { Write-Error 'install.ps1 must be ASCII (Windows PowerShell 5.1 reads it as ANSI)'; exit 1 }

  # On Linux only a stub binary is built; the platform independent modules are tested here.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, 2026-07-16
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, 2026-08-06
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, 2026-07-16
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2, 2026-07-13
        with:
          command: check
          # Must match rust-toolchain.toml, otherwise the toolchain is missing in the container.
          rust-version: "1.95.0"

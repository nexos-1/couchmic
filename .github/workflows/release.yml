name: release

# A tag v<version> builds the release zip and creates a draft GitHub release (review and publish
# it by hand). "Run workflow" builds the same zip as an artifact only.
#
# Jobs: "build" runs third-party build code (build scripts, proc macros, cargo-about) with a
# read-only token and no cache, so a compromised dependency cannot push to the repository or
# edit releases. It could still tamper with the files it builds; the draft release therefore
# has to be reviewed before it is published. "attest" (build provenance, public repositories)
# and "publish" (draft release) run no third-party build code.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: 1.95.0

      - name: Version
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $version = $meta.packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          # No runner paths in the binary.
          "RUSTFLAGS=--remap-path-prefix=$env:GITHUB_WORKSPACE=couchmic --remap-path-prefix=$env:USERPROFILE=home" >> $env:GITHUB_ENV

      - run: cargo test --locked
      - run: cargo build --release --locked

      # cargo-about 0.9.2 (2026-08-18) writes the third-party license notices for the binary.
      - name: Third-party licenses
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "couchmic-${{ steps.version.outputs.version }}-windows-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/couchmic.exe, install.ps1, README.md, README.de.md, LICENSE, CHANGELOG.md, THIRD-PARTY-LICENSES.html $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/$name.zip" -Force
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash "$dir/couchmic.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip`n$exeHash  couchmic.exe" | Set-Content -Encoding ascii "dist/$name.sha256"
          Get-Content "dist/$name.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, 2026-04-10
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}.sha256

  # Build provenance for the zip and the exe. Separate job: it holds the OIDC token, so it must
  # not run any third-party build code. GitHub offers attestations for public repositories.
  attest:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, 2026-03-11
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist
      - name: Unpack the exe
        env:
          NAME: ${{ needs.build.outputs.name }}
        run: unzip -o "dist/$NAME.zip" couchmic.exe -d dist/unpacked
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2, 2026-08-06
        with:
          subject-path: |
            dist/${{ needs.build.outputs.name }}.zip
            dist/unpacked/couchmic.exe

  publish:
    # Wait for the attestation; a skipped one (private repository) is fine, a failed one is not.
    if: ${{ always() && github.ref_type == 'tag' && needs.build.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, 2026-03-11
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.build.outputs.name }}
          ATTESTED: ${{ needs.attest.result == 'success' }}
        run: |
          verify=""
          if [ "$ATTESTED" = "true" ]; then
            verify="Verify the build: gh attestation verify couchmic.exe -R $GITHUB_REPOSITORY"
          fi
          notes="$(printf 'See CHANGELOG.md. %s\n\nSHA-256:\n\n```\n%s\n```\n' "$verify" "$(cat "dist/$NAME.sha256")")"
          gh release create "$GITHUB_REF_NAME" "dist/$NAME.zip" "dist/$NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" --draft --title "CouchMic $GITHUB_REF_NAME" --notes "$notes"
